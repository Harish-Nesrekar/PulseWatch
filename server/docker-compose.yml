services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsewatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in server/.env}
      POSTGRES_DB: pulsewatch
    ports:
      - "5432:5432"
    volumes:
      - pulsewatch_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsewatch -d pulsewatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulsewatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pulsewatch_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pulsewatch_postgres:
  pulsewatch_redis:
